services:
  litellm:
    image: ghcr.io/berriai/litellm:main-latest
    dns:
      - 8.8.8.8
      - 1.1.1.1
    healthcheck:
      test: ["CMD-SHELL", "python3 -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:4000/health/liveliness\")' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
    ports:
      - "4000:4000"
    volumes:
      - ./litellm_config.yaml:/app/litellm_config.yaml
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    command: [ "--config", "/app/litellm_config.yaml", "--port", "4000" ]

  mosquitto:
    image: eclipse-mosquitto:latest
    ports:
      - "8883:8883"
    restart: unless-stopped
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf
      - ./certs:/mosquitto/certs:ro
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_sub -t '$$SYS/#' -C 1 -W 3 -p 8883 --cafile /mosquitto/certs/ca.crt || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  sre_agent:
    network_mode: "host"
    dns:
      - 8.8.8.8
      - 1.1.1.1
    image: python:3.11-slim
    working_dir: /app
    restart: unless-stopped
    stdin_open: true
    tty: true
    depends_on:
      mosquitto:
        condition: service_healthy
      litellm:
        condition: service_healthy
    volumes:
      - .:/app
      - ~/.postgresql/root.crt:/root/.postgresql/root.crt:ro
    environment:
      - PYTHONPATH=/app
      - COCKROACH_DATABASE_URL=${COCKROACH_DATABASE_URL}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://127.0.0.1:11434}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-http://127.0.0.1:4000}
      - MQTT_BROKER_HOST=127.0.0.1
      - COCKROACH_MCP_URL=${COCKROACH_MCP_URL}
      - COCKROACH_MCP_API_KEY=${COCKROACH_MCP_API_KEY}
      - MCP_CLUSTER_ID=${MCP_CLUSTER_ID}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - LANGCHAIN_TRACING_V2=${LANGCHAIN_TRACING_V2}
      - LANGCHAIN_ENDPOINT=${LANGCHAIN_ENDPOINT}
      - LANGCHAIN_API_KEY=${LANGCHAIN_API_KEY}
      - LANGCHAIN_PROJECT=${LANGCHAIN_PROJECT}
      - PYTHONUNBUFFERED=1
    command: >
      bash -c "pip install --no-cache-dir -r requirements.txt && python -m src.main"

  prometheus:
    image: prom/prometheus:latest
    network_mode: "host"
    mem_limit: 256m
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml

  grafana:
    image: grafana/grafana-oss:latest
    network_mode: "host"
    mem_limit: 256m
    environment:
      - GF_SERVER_HTTP_PORT=3000
