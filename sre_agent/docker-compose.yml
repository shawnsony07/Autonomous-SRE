services:
  litellm:
    image: ghcr.io/berriai/litellm:main-latest
    ports:
      - "4000:4000"
    volumes:
      - ./litellm_config.yaml:/app/litellm_config.yaml
    environment:
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_REGION_NAME=${AWS_REGION_NAME:-ap-south-2}
    command: [ "--config", "/app/litellm_config.yaml", "--port", "4000" ]

  mosquitto:
    image: eclipse-mosquitto:latest
    network_mode: "host"
    restart: unless-stopped
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_sub -t '$$SYS/#' -C 1 -W 3 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

  sre_agent:
    image: python:3.11-slim
    working_dir: /app
    network_mode: "host"
    restart: unless-stopped
    stdin_open: true
    tty: true
    depends_on:
      mosquitto:
        condition: service_healthy
      litellm:
        condition: service_started
    volumes:
      - .:/app
      - ~/.postgresql/root.crt:/root/.postgresql/root.crt:ro
    environment:
      - PYTHONPATH=/app
      - COCKROACH_DATABASE_URL=${COCKROACH_DATABASE_URL}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://localhost:11434}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-http://localhost:4000}
      - COCKROACH_MCP_URL=${COCKROACH_MCP_URL}
      - COCKROACH_MCP_API_KEY=${COCKROACH_MCP_API_KEY}
      - MCP_CLUSTER_ID=${MCP_CLUSTER_ID}
      - PYTHONUNBUFFERED=1
    command: >
      bash -c "pip install --no-cache-dir -r requirements.txt && python -m src.main"
