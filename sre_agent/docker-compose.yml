services:
  mosquitto:
    image: eclipse-mosquitto:latest
    network_mode: "host"
    restart: unless-stopped
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_sub -t '$$SYS/#' -C 1 -W 3 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

  sre_agent:
    image: python:3.11-slim
    working_dir: /app
    network_mode: "host"
    restart: unless-stopped
    stdin_open: true
    tty: true
    depends_on:
      mosquitto:
        condition: service_healthy
    volumes:
      - .:/app
    environment:
      - COCKROACH_DATABASE_URL=${COCKROACH_DATABASE_URL}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://localhost:11434}
      - COCKROACH_MCP_URL=${COCKROACH_MCP_URL}
      - COCKROACH_MCP_API_KEY=${COCKROACH_MCP_API_KEY}
      - MCP_CLUSTER_ID=${MCP_CLUSTER_ID}
      - PYTHONUNBUFFERED=1
    command: >
      bash -c "pip install --no-cache-dir -r requirements.txt && python src/main.py"
